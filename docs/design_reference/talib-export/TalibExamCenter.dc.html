<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./law-profiles.js"></script><script src="./shared-exams.js"></script></helmet>
<div dir="rtl" data-screen-label="Exam Center" style="display:flex; flex-direction:column; gap:20px; min-width:0;">
  <div style="display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px;">
    <div style="min-width:0;">
      <h1 style="font-size:26px; font-weight:700; line-height:1.3;">امتحان</h1>
      <div style="font-size:14px; color:var(--law-muted); margin-top:2px;">تدرب على موادك، أو جرّب امتحانات نشرها زملاؤك.</div>
    </div>
    <div style="display:flex; gap:2px; padding:4px; border-radius:14px; background:var(--law-surface-2);">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.pick }}" style="height:38px; padding:0 16px; border-radius:11px; border:none; background:{{ t.bg }}; color:{{ t.fg }}; box-shadow:{{ t.shadow }}; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;">{{ t.label }}</button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ isMine }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; padding:2px 2px 8px;">
      <sc-for list="{{ subjects }}" as="s" hint-placeholder-count="3">
        <button onClick="{{ s.pick }}" style="flex:0 0 auto; min-width:200px; display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:18px; border:2px solid {{ s.border }}; background:{{ s.bg }}; text-align:right; cursor:pointer; box-shadow:0 4px 0 {{ s.edge }}; transition:transform 120ms, box-shadow 120ms;" style-active="transform:translateY(4px); box-shadow:0 0 0 transparent;">
          <span style="width:10px; height:38px; border-radius:5px; background:{{ s.color }}; flex-shrink:0;"></span>
          <span style="line-height:1.4; min-width:0;"><span style="display:block; font-size:14.5px; font-weight:700; color:var(--law-text); white-space:nowrap;">{{ s.name }}</span><span style="display:block; font-size:12px; color:var(--law-muted); white-space:nowrap;">{{ s.sub }}</span></span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isShared }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px;">
      <sc-for list="{{ shared }}" as="e" hint-placeholder-count="2">
        <button onClick="{{ e.pick }}" style="display:flex; flex-direction:column; align-items:stretch; gap:10px; padding:16px; border-radius:20px; border:2px solid {{ e.border }}; background:{{ e.bg }}; text-align:right; cursor:pointer; box-shadow:0 4px 0 {{ e.edge }};" style-active="transform:translateY(4px); box-shadow:0 0 0 transparent;">
          <span style="display:flex; align-items:center; gap:10px;">
            <span style="width:34px; height:34px; flex-shrink:0;"><dc-import name="TalibAvatar" preset="{{ e.author }}" still="{{ true }}" hint-size="34px,34px"></dc-import></span>
            <span style="flex:1; min-width:0; line-height:1.35;"><span style="display:block; font-size:13px; font-weight:700; color:var(--law-text);">{{ e.authorName }}</span><span style="display:block; font-size:11.5px; color:var(--law-muted);">{{ e.subject }} · {{ e.sem }}</span></span>
          </span>
          <span style="font-size:14.5px; font-weight:700; line-height:1.55; color:var(--law-text);">{{ e.title }}</span>
          <span style="font-size:12px; color:var(--law-muted);">{{ e.stats }}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{ noShared }}" hint-placeholder-val="{{ false }}">
      <div style="padding:30px; text-align:center; border-radius:22px; border:2px dashed var(--law-line-strong); font-size:14px; color:var(--law-muted);">لم ينشر أحد امتحاناً بعد. افتح إحدى موادك واضغط «📤 انشر في الملتقى».</div>
    </sc-if>
    <sc-if value="{{ hasSharedNote }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; gap:12px; padding:14px 16px; border-radius:18px; background:var(--law-surface-2); font-size:13.5px; line-height:1.8;"><span style="font-size:18px;">💬</span><span style="flex:1;"><strong>{{ curShared.authorName }}:</strong> {{ curShared.note }}</span></div>
    </sc-if>
  </sc-if>

  <sc-if value="{{ hasSubject }}" hint-placeholder-val="{{ true }}">
    <dc-import name="TalibBranch" branch="{{ cur.branch }}" compact="{{ true }}" hint-size="100%,220px"></dc-import>
    <dc-import name="TalibExam" branch="{{ cur.branch }}" subject-id="{{ cur.id }}" subject-name="{{ cur.name }}" units="{{ cur.units }}" bank="{{ cur.bank }}" cfg="{{ cur.cfg }}" author="{{ cur.authorName }}" on-publish="{{ cur.onPublish }}" on-xp="{{ onXp }}" on-toast="{{ onToast }}" hint-size="100%,560px"></dc-import>
  </sc-if>
  <sc-if value="{{ noSubjects }}" hint-placeholder-val="{{ false }}">
    <div style="padding:40px; text-align:center; border-radius:24px; border:2px dashed var(--law-line-strong); display:flex; flex-direction:column; align-items:center; gap:10px;">
      <span style="font-size:30px;">🎯</span>
      <span style="font-size:15px; font-weight:700;">لا توجد مواد بعد</span>
      <button onClick="{{ goStudio }}" style="height:42px; padding:0 18px; border-radius:13px; border:none; background:var(--law-accent); color:#ffffff; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 4px 0 var(--law-accent-deep);">أنشئ مادة في «تعلم»</button>
    </div>
  </sc-if>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:90; padding:12px 20px; border-radius:999px; background:var(--law-text); color:var(--law-bg); font-size:14px; font-weight:600; box-shadow:var(--law-shadow-pop); animation:talibSpring 0.4s ease-out both;">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;openShared&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onXp&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n:number,l:string)=&gt;void&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  COLORS = ['#1f8a5b', '#3b6fc4', '#c4683f', '#8b6cf0', '#c79a2e', '#1aa3a3'];
  constructor(p) {
    super(p);
    let subs = [], ex = {};
    try { subs = (JSON.parse(localStorage.getItem('talib.studio.v2') || 'null') || {}).subjects || []; ex = JSON.parse(localStorage.getItem('talib.exam.v1') || '{}'); } catch (e) {}
    if (!subs.length) subs = [{ id: 'civil', name: 'المسؤولية المدنية', sem: 'S3', color: 0, unitsLite: [] }];
    this.state = { subs, ex, sel: subs[0] ? subs[0].id : null, tab: p.openShared ? 'shared' : 'mine', sharedSel: p.openShared ? p.openShared.split('#')[0] : null, shared: [], toast: '' };
  }
  componentDidMount() { const t = () => { if (window.TALIB_SHARED) { const l = window.TALIB_SHARED.list(); this.setState(s => ({ shared: l, sharedSel: s.sharedSel || (l[0] && l[0].id) })); } else this.pt = setTimeout(t, 80); }; t(); }
  componentDidUpdate(pp) { if (this.props.openShared && pp.openShared !== this.props.openShared) this.setState({ tab: 'shared', sharedSel: this.props.openShared.split('#')[0] }); }
  componentWillUnmount() { clearTimeout(this.tt); clearTimeout(this.pt); }
  flash(t) { this.setState({ toast: t }); clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 2400); }
  renderVals() {
    const st = this.state;
    const L = window.TALIB_LAW;
    const segOn = { bg: 'var(--law-surface)', fg: 'var(--law-text)', shadow: '0 1px 3px rgba(0,0,0,0.18)' };
    const segOff = { bg: 'transparent', fg: 'var(--law-muted)', shadow: 'none' };
    const on = { border: 'var(--law-accent)', bg: 'var(--law-accent-tint)', edge: 'var(--law-accent-deep)' };
    const off = { border: 'var(--law-line-strong)', bg: 'var(--law-surface)', edge: 'var(--law-line-strong)' };
    const isShared = st.tab === 'shared';
    const curS = st.subs.find(s => s.id === st.sel);
    const curX = st.shared.find(e => e.id === st.sharedSel);
    let cur = null;
    if (!isShared && curS) cur = { id: curS.id, name: curS.name, units: curS.unitsLite || [], branch: curS.branch || (L ? L.detect(curS.name) : 'civil'), bank: null, cfg: null, authorName: '',
      onPublish: ({ cfg, bank }) => { if (!window.TALIB_SHARED) return; const e = { id: 'me-' + curS.id + '-' + Date.now(), author: 'me', authorName: 'يوسف الإدريسي', title: 'امتحان تجريبي: ' + curS.name, subject: curS.name, branch: cur.branch, sem: curS.sem, at: new Date().toISOString().slice(0, 10), takes: 0, likes: 0, note: '', cfg, bank };
        const l = window.TALIB_SHARED.add(e); this.setState({ shared: l, tab: 'shared', sharedSel: e.id }); this.flash('📤 نُشر امتحانك في الملتقى'); this.props.onXp && this.props.onXp(20, 'شاركت امتحاناً'); } };
    if (isShared && curX) cur = { id: 'shared_' + curX.id, name: curX.subject, units: [], branch: curX.branch, bank: curX.bank, cfg: curX.cfg, authorName: curX.authorName, onPublish: null };
    return {
      tabs: [['mine', '📚 موادي'], ['shared', '👥 امتحانات الزملاء']].map(([k, label]) => ({ label, ...(st.tab === k ? segOn : segOff), pick: () => this.setState({ tab: k }) })),
      isMine: !isShared, isShared,
      subjects: st.subs.map(s => { const a = s.id === st.sel; const e = st.ex[s.id]; const done = e && e.done ? Object.keys(e.done).length : 0; const total = e && e.cfg ? e.cfg.types.length : 0;
        return { name: s.name, sub: s.sem + ' · ' + (total ? done + '/' + total + ' مراحل' : 'لم تضبط التدريب بعد'), color: this.COLORS[s.color] || this.COLORS[0], ...(a ? on : off), pick: () => this.setState({ sel: s.id }) }; }),
      shared: st.shared.map(e => ({ ...e, stats: (e.takes || 0) + ' جربوه · ' + Object.values(e.bank || {}).reduce((a, x) => a + x.length, 0) + ' أسئلة', ...(e.id === st.sharedSel ? on : off), pick: () => { this.setState({ sharedSel: e.id }); } })),
      noShared: isShared && !st.shared.length,
      curShared: curX || { authorName: '', note: '' }, hasSharedNote: isShared && !!(curX && curX.note),
      hasSubject: !!cur, noSubjects: !isShared && !st.subs.length,
      cur: cur || { id: '', name: '', units: [], branch: 'civil', bank: null, cfg: null, authorName: '', onPublish: null },
      onXp: (n, l) => this.props.onXp && this.props.onXp(n, l), onToast: (t) => this.flash(t),
      goStudio: () => this.props.onNavigate && this.props.onNavigate('studio'),
      hasToast: !!st.toast, toast: st.toast
    };
  }
}
</script>
</body>
</html>
